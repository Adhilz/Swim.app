<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f48c25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221910",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'clay': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3), inset 0 -4px 6px 0 rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'clay-primary': 'inset 0 4px 6px 0 rgba(255, 255, 255, 0.4), inset 0 -4px 6px 0 rgba(0, 0, 0, 0.1), 0 10px 20px -5px rgba(244, 140, 37, 0.4)',
                        'clay-input': 'inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,0.8)'
                    }
                },
            },
        }
    </script>
<style>
        .clay-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .clay-button {
            transition: all 0.2s ease;
        }
        .clay-button:active {
            transform: scale(0.96);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden pb-24">
<header class="flex items-center p-6 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center rounded-full clay-card shadow-clay">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Request Delivery</h2>
</header>
<main class="px-6">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold leading-tight pb-6 pt-8">Deliver Anything</h3>
<div class="space-y-6">
<!-- What are we picking up? -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">What are we picking up?</label>
<div class="clay-card shadow-clay rounded-2xl p-1">
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary/20 min-h-32 placeholder:text-slate-400 p-4 text-base font-normal leading-normal shadow-clay-input" placeholder="e.g. A bouquet of flowers, forgotten keys..."></textarea>
</div>
</div>
<!-- Pickup Location -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Pickup Location</label>
<div class="clay-card shadow-clay rounded-2xl p-1 flex items-center">
<div class="flex w-full items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-white/50 focus:bg-white focus:ring-0 h-14 placeholder:text-slate-400 p-4 rounded-l-xl text-base font-normal leading-normal shadow-clay-input" placeholder="Enter pickup address"/>
<div class="text-primary flex bg-white/50 items-center justify-center pr-4 rounded-r-xl">
<span class="material-symbols-outlined">location_on</span>
</div>
</div>
</div>
</div>
<!-- Drop-off Location -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Drop-off Location</label>
<div class="clay-card shadow-clay rounded-2xl p-1 flex items-center">
<div class="flex w-full items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-white/50 focus:bg-white focus:ring-0 h-14 placeholder:text-slate-400 p-4 rounded-l-xl text-base font-normal leading-normal shadow-clay-input" placeholder="Enter destination address"/>
<div class="text-primary flex bg-white/50 items-center justify-center pr-4 rounded-r-xl">
<span class="material-symbols-outlined">flag</span>
</div>
</div>
</div>
</div>
<!-- Delivery Partner Instructions -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Instructions for Delivery Partner</label>
<div class="clay-card shadow-clay rounded-2xl p-1">
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary/20 h-14 placeholder:text-slate-400 p-4 rounded-xl text-base font-normal leading-normal shadow-clay-input" placeholder="Door code, specific entrance, etc."/>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Section -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark max-w-md mx-auto">
<button class="clay-button w-full h-16 bg-primary text-white text-lg font-bold rounded-2xl shadow-clay-primary flex items-center justify-center gap-2">
<span>Next</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Decorative Elements for Claymorphism feel -->
<div class="fixed -top-10 -right-10 w-40 h-40 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed top-1/2 -left-20 w-60 h-60 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
</body></html>
