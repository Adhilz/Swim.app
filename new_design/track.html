<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f48c25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221910",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .clay-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.05),
                inset -6px -6px 12px rgba(0, 0, 0, 0.05),
                inset 6px 6px 12px rgba(255, 255, 255, 0.8);
        }
        .clay-button-primary {
            background: #f48c25;
            box-shadow: 
                inset -4px -4px 8px rgba(0, 0, 0, 0.2),
                inset 4px 4px 8px rgba(255, 255, 255, 0.3),
                4px 4px 12px rgba(244, 140, 37, 0.3);
        }
        .clay-map-container {
            box-shadow: 
                inset 10px 10px 20px rgba(0,0,0,0.05),
                inset -10px -10px 20px rgba(255,255,255,0.5);
        }
        .marker-3d {
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.2));
            transform: perspective(500px) rotateX(20deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Header -->
<header class="absolute top-0 left-0 right-0 z-20 p-4">
<div class="flex items-center justify-between clay-card rounded-xl p-3">
<button class="flex size-10 items-center justify-center rounded-lg hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-slate-700">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[10px] font-bold uppercase tracking-widest text-primary">Live Tracking</span>
<h2 class="text-sm font-bold text-slate-800">Order #88219</h2>
</div>
<button class="flex size-10 items-center justify-center rounded-lg hover:bg-white/50 transition-colors">
<span class="material-symbols-outlined text-slate-700">more_horiz</span>
</button>
</div>
</header>
<!-- Map View Area -->
<main class="relative flex-1 bg-[#e5e7eb] overflow-hidden clay-map-container">
<!-- Simulated Map Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="Modern map illustration with soft colors and street paths" data-location="San Francisco" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRPtmmpRHqrKrYpuelbfiddm8pbUtVnoO19yZioz8PksqxbrSB0BECyWAwCRDASj5Y2O6x4bYUWHY2QF1MSyFS89Snq6wJdRJm132vwh989LzUimmBvEDq3R2e63HGc3cDuMpPjqA-Urccxu3l-_Q6z6CmhcLZ37AdVB9tO_wsev3D98z7HTOcZpOGDG1YH1cHTG5K13HsxZ_GM6pY57ycIC6bLzlWH9rmLYsKh_JJtnK2doOo_t1LgouqAf68rz9XNamL6GGYdFo');">
</div>
<!-- 3D Delivery Marker -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
<div class="marker-3d relative flex flex-col items-center">
<div class="bg-primary p-3 rounded-2xl clay-button-primary border-4 border-white">
<span class="material-symbols-outlined text-white text-3xl">electric_moped</span>
</div>
<div class="w-2 h-2 bg-primary/40 rounded-full blur-[2px] mt-4 scale-x-150"></div>
</div>
</div>
<!-- Destination Marker -->
<div class="absolute top-1/3 right-1/4 z-10">
<div class="flex flex-col items-center">
<div class="bg-slate-900 p-2 rounded-full border-2 border-white shadow-lg">
<span class="material-symbols-outlined text-white text-sm">home</span>
</div>
</div>
</div>
<!-- Map Controls -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-10">
<button class="clay-card size-12 flex items-center justify-center rounded-xl">
<span class="material-symbols-outlined text-slate-700">add</span>
</button>
<button class="clay-card size-12 flex items-center justify-center rounded-xl">
<span class="material-symbols-outlined text-slate-700">remove</span>
</button>
<button class="clay-card size-12 flex items-center justify-center rounded-xl mt-4">
<span class="material-symbols-outlined text-primary fill-1">navigation</span>
</button>
</div>
</main>
<!-- Bottom Sheet (Delivery Status) -->
<section class="relative z-30 bg-white dark:bg-slate-900 rounded-t-xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-6 pb-8 transition-all duration-300 translate-y-0">
<!-- Pull Bar -->
<div class="absolute top-2 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
<div class="mt-2">
<div class="flex items-center gap-4 mb-6">
<div class="bg-primary/10 p-3 rounded-2xl">
<span class="material-symbols-outlined text-primary text-3xl animate-pulse">package_2</span>
</div>
<div>
<h3 class="text-xl font-extrabold text-slate-900 dark:text-slate-100">Picking up your item</h3>
<p class="text-sm text-slate-500">Expected delivery: 12:45 PM</p>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full mb-8 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full"></div>
</div>
<!-- Delivery Partner Info -->
<div class="clay-card rounded-2xl p-4 flex items-center justify-between border-slate-100 bg-white/40">
<div class="flex items-center gap-3">
<div class="size-14 rounded-xl overflow-hidden bg-slate-200">
<img alt="Delivery Partner Photo" class="w-full h-full object-cover" data-alt="Friendly delivery partner portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCk2aGTpSuSNE3Dg6Gr6KWsXL2WKvNuspGpVvnBrqeJP_HWEvG_nArWCD5Bn9GRZ-Qc9oEEnnE_aNaLhFeIdnmQJInzTUb8yDRJ6v694RFavaRO2Z_pEZTnPCR-8G35NDeTyMcisMzxqLMWlX3hFwer8HoKzT9wC0pQjeYUdgEy9-CWoRqcrd7eb-Xlr0RhirgcyyPaSECdOERzbl4znRTi70W853eXXC_9KgKp6u6Kxggdv58LdVFgiN3L6_tbhhJZTqHzjsO81Vo"/>
</div>
<div>
<h4 class="font-bold text-slate-800 dark:text-slate-100">David Miller</h4>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-yellow-500 text-sm fill-1">star</span>
<span class="text-xs font-bold text-slate-600 dark:text-slate-400">4.9 (1.2k reviews)</span>
</div>
</div>
</div>
<div class="flex gap-2">
<button class="clay-card size-12 flex items-center justify-center rounded-xl bg-white border-primary/20 hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-primary">chat_bubble</span>
</button>
<button class="clay-button-primary size-12 flex items-center justify-center rounded-xl text-white hover:scale-105 transition-transform">
<span class="material-symbols-outlined">call</span>
</button>
</div>
</div>
<!-- Footer Action -->
<button class="w-full mt-6 py-4 bg-primary text-white font-extrabold rounded-xl clay-button-primary tracking-wide text-lg">
                    Contact Partner
                </button>
</div>
</section>
<!-- Bottom Navigation Bar -->
<nav class="bg-white border-t border-slate-100 flex justify-around items-center px-4 py-3 z-40">
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-bold">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="text-[10px] font-bold">Orders</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<div class="bg-primary/10 p-1.5 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined fill-1">location_on</span>
</div>
<span class="text-[10px] font-bold">Track</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
</div>
</body></html>
